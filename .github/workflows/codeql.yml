# Actions are pinned by full commit SHA with a version comment; upgrades are intentional PRs.
# First real scan runs after merge to the default branch. Fork PRs may not upload results.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 7 * * 1" # weekly Monday 07:41 UTC

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          category: "/language:python"
