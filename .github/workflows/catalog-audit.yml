# Actions are pinned by full commit SHA with a version comment; upgrades are intentional PRs.
#
# Daily maintainer check: pinned free presets vs each platform GET /models.
# - Exit 1 when a pin is missing (gone from the catalog).
# - Exit 1 when a configured provider's catalog cannot be read (--fail-on-catalog-error).
# - Unpinned ids are reported only (Job Summary + notice); never auto-routed.
# Configure the free-tier secrets below; absent secrets skip that preset.
# OVHcloud is always compared (anonymous, keyless default). Discovery-only presets
# (OpenRouter, Kilo, Requesty) are omitted: they pin nothing for audit().
name: catalog-audit

on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/freeai/providers/**"
      - "src/freeai/__main__.py"
      - "src/freeai/_core.py"
      - "src/freeai/client.py"
      - ".github/workflows/catalog-audit.yml"

concurrency:
  group: catalog-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Compare pinned model lists with live catalogs
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: uv run freeai audit --fail-on-catalog-error
