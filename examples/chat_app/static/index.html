<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>freeai 채팅</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #66665f; --border: #d9d9d3;
    --user: #e7eefc; --accent: #2457c5; --accent-text: #ffffff; --error-bg: #fdecea; --error: #8a1c12;
    --focus: #f0a400;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --text: #ecece8; --muted: #a3a39b; --border: #3a3a36;
      --user: #22314f; --accent: #7aa2ff; --accent-text: #0b1530; --error-bg: #3b1a17; --error: #ffb4a8;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
    display: flex; flex-direction: column;
  }
  header, main, form { width: 100%; max-width: 820px; margin: 0 auto; padding-inline: 16px; }
  header { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding-block: 12px; }
  header h1 { font-size: 1.1rem; margin: 0 auto 0 0; }
  label.inline { display: flex; gap: 6px; align-items: center; font-size: .9rem; color: var(--muted); }
  select, button, textarea {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px;
  }
  select { padding: 6px 8px; max-width: 60vw; }
  button { padding: 8px 14px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  main { flex: 1; overflow-y: auto; padding-block: 8px 16px; }
  .msg { padding: 10px 14px; border-radius: 10px; margin: 10px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.user { background: var(--user); margin-left: 15%; }
  .msg.assistant { background: var(--panel); border: 1px solid var(--border); margin-right: 8%; }
  .msg.error { background: var(--error-bg); color: var(--error); }
  .meta { display: block; margin-top: 6px; font-size: .78rem; color: var(--muted); }
  .empty { color: var(--muted); text-align: center; margin-top: 18vh; }
  form { display: flex; gap: 8px; align-items: flex-end; padding-block: 12px 16px; border-top: 1px solid var(--border); }
  textarea { flex: 1; min-height: 46px; max-height: 40vh; padding: 10px 12px; resize: vertical; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #status { font-size: .85rem; color: var(--muted); min-height: 1.3em; width: 100%; max-width: 820px; margin: 0 auto; padding-inline: 16px; }
  @media (max-width: 520px) {
    .msg.user { margin-left: 6%; } .msg.assistant { margin-right: 0; }
    header h1 { width: 100%; }
  }
</style>
</head>
<body>
<header>
  <h1>freeai 채팅</h1>
  <label class="inline" for="model">모델
    <select id="model"><option value="auto">auto (자동 선택)</option></select>
  </label>
  <button type="button" id="new-chat">새 대화</button>
</header>
<main id="log" role="log" aria-live="polite" aria-relevant="additions" aria-label="대화 내용">
  <p class="empty" id="empty">무료 모델 사이를 자동으로 오가며 답합니다. 아래에 메시지를 입력하세요.</p>
</main>
<p id="status" role="status" aria-live="polite"></p>
<form id="composer">
  <label for="input" class="sr-only">메시지</label>
  <textarea id="input" rows="2" maxlength="8000" placeholder="메시지 입력 (Enter 전송, Shift+Enter 줄바꿈)" required></textarea>
  <button type="submit" class="primary" id="send">전송</button>
  <button type="button" id="stop" hidden>중지</button>
</form>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("input"), send = $("send"), stop = $("stop"), statusLine = $("status");
let sessionId = null, controller = null;

function bubble(role, text) {
  $("empty")?.remove();
  const div = document.createElement("div");
  div.className = "msg " + role;
  const body = document.createElement("span");
  body.textContent = text;  // never innerHTML: model output is untrusted
  div.append(body);
  log.append(div);
  scrollEnd();
  return { div, body };
}

function scrollEnd() { log.scrollTop = log.scrollHeight; }

function setMeta(div, text) {
  const meta = document.createElement("span");
  meta.className = "meta";
  meta.textContent = text;
  div.append(meta);
  scrollEnd();
}

function busy(on) {
  send.disabled = on; stop.hidden = !on; input.setAttribute("aria-busy", String(on));
  if (!on) input.focus();
}

async function loadModels() {
  try {
    const data = await (await fetch("/api/models")).json();
    const select = $("model");
    for (const alias of data.aliases.filter((a) => a !== "auto")) select.add(new Option(alias + " (별칭)", alias));
    for (const m of data.models) select.add(new Option(m.key, m.key));
  } catch { /* the default "auto" still works */ }
}

async function submit(text) {
  bubble("user", text);
  const reply = bubble("assistant", "");
  reply.body.textContent = "…";
  controller = new AbortController();
  busy(true);
  statusLine.textContent = "응답 생성 중";
  try {
    const response = await fetch("/api/chat", {
      method: "POST", signal: controller.signal, headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, session_id: sessionId, model: $("model").value }),
    });
    if (!response.ok) {
      const err = (await response.json().catch(() => ({}))).error || {};
      const retry = response.headers.get("Retry-After");
      reply.div.className = "msg error";
      reply.body.textContent = (err.message || "요청 실패 (" + response.status + ")") + (retry ? " " + retry + "초 후 다시 시도하세요." : "");
      statusLine.textContent = "";
      scrollEnd();
      return;
    }
    await readEvents(response, reply);
  } catch (e) {
    if (e.name === "AbortError") { setMeta(reply.div, "중지됨"); statusLine.textContent = "중지했습니다."; }
    else { reply.div.className = "msg error"; reply.body.textContent = "연결 오류: " + e.message; statusLine.textContent = ""; scrollEnd(); }
  } finally {
    controller = null;
    busy(false);
  }
}

async function readEvents(response, reply) {
  const reader = response.body.getReader(), decoder = new TextDecoder();
  let buffer = "", text = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let cut;
    while ((cut = buffer.indexOf("\n\n")) >= 0) {
      const block = buffer.slice(0, cut); buffer = buffer.slice(cut + 2);
      let event = "message", data = "";
      for (const line of block.split("\n")) {
        if (line.startsWith("event: ")) event = line.slice(7);
        else if (line.startsWith("data: ")) data += line.slice(6);
      }
      const payload = data ? JSON.parse(data) : {};
      if (event === "meta") { sessionId = payload.session_id; statusLine.textContent = payload.provider + " / " + payload.model + " 응답 중"; }
      else if (event === "delta") { text += payload.text; reply.body.textContent = text; scrollEnd(); }
      else if (event === "done") {
        setMeta(reply.div, payload.provider + " / " + payload.model + ", 첫 토큰 " + payload.ttft_ms + "ms, 전체 " + payload.total_ms + "ms");
        statusLine.textContent = "완료";
      } else if (event === "error") {
        setMeta(reply.div, "스트림 중단: " + payload.message);
        statusLine.textContent = "응답이 중간에 끊겼습니다.";
      }
    }
  }
}

$("composer").addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || controller) return;
  input.value = "";
  submit(text);
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("composer").requestSubmit(); }
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && controller) controller.abort(); });
stop.addEventListener("click", () => controller?.abort());
$("new-chat").addEventListener("click", () => {
  controller?.abort();
  sessionId = null;
  log.replaceChildren();
  const p = document.createElement("p"); p.className = "empty"; p.id = "empty";
  p.textContent = "새 대화를 시작했습니다.";
  log.append(p);
  statusLine.textContent = "";
  input.focus();
});
loadModels();
input.focus();
</script>
</body>
</html>
